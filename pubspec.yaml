name: klarwave
description: Klarwave Music - pemutar musik gratis tanpa iklan dengan desain liquid glass.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.11
  cached_network_image: ^3.3.1
  flutter_riverpod: ^2.5.1
  http: ^1.2.0
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
